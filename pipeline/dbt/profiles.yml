vietgreen_evidence:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', 'db') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'vietgreen') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'vietgreen') }}"
      schema: pipeline_transform
      threads: 2
